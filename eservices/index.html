<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eservices Newsletter</title>
    <meta
      name="description"
      content="Assine ou cancele a newsletter eservices de forma rapida."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-2" aria-hidden="true"></div>

    <main class="shell">
      <section class="card">
        <p class="eyebrow">eservices</p>
        <h1>Newsletter</h1>
        <p class="subtitle">
          Fique por dentro do que já está facilitando a rotina.
        </p>

        <div id="updatesCarousel" class="carousel" aria-label="Novidades" aria-live="polite" hidden>
          <div class="carousel-track">
            <div class="carousel-slide" id="carouselSlide">
              <p class="carousel-titulo" id="carouselTitulo"></p>
              <p class="carousel-desc" id="carouselDesc"></p>
            </div>
          </div>
          <div class="carousel-nav">
            <button class="carousel-btn" id="carouselPrev" aria-label="Anterior">&#8592;</button>
            <span class="carousel-indicator" id="carouselIndicator"></span>
            <button class="carousel-btn" id="carouselNext" aria-label="Próximo">&#8594;</button>
          </div>
        </div>

        <form id="newsletterForm" class="form" novalidate>

          <label id="nameField" class="field" for="name">
            <span>Nome</span>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Seu nome"
              autocomplete="name"
            />
          </label>

          <label class="field" for="email">
            <span>Email</span>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="voce@dominio.com"
              autocomplete="email"
              required
            />
          </label>

          <div class="actions">
            <button id="submitButton" type="submit" class="btn btn-primary">
              Assinar
            </button>
          </div>

          <div class="actions" style="margin-top: -4px;">
            <a
              id="toggleModeLink"
              href="#"
              aria-label="Alternar entre assinar e cancelar"
              style="font-size: 14px; opacity: 0.8; text-decoration: underline; text-underline-offset: 2px;"
            >
              Cancelar assinatura
            </a>
          </div>

          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </form>

      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
